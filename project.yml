name: PlaudLocal
options:
  bundleIdPrefix: dev.metahertz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.9"
  DEVELOPMENT_TEAM: 3C5PM5Q74H
  CODE_SIGN_STYLE: Automatic
  CURRENT_PROJECT_VERSION: 4
  MARKETING_VERSION: "0.4.2"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 0.12.0
targets:
  PlaudLocal:
    type: application
    platform: iOS
    sources:
      - path: PlaudLocal
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.metahertz.plaudlocal
      DEVELOPMENT_TEAM: 3C5PM5Q74H
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_FILE: PlaudLocal/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1"
    info:
      path: PlaudLocal/Info.plist
      properties:
        CFBundleDisplayName: Plaud Local
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: Plaud Local connects to your Plaud Note Pro over Bluetooth to download recordings you own.
        NSBluetoothPeripheralUsageDescription: Plaud Local connects to your Plaud Note Pro over Bluetooth to download recordings you own.
        NSSpeechRecognitionUsageDescription: Plaud Local transcribes your Note Pro recordings on this iPhone.
        NSLocalNetworkUsageDescription: Plaud Local talks to your Note Pro over its local Wi‑Fi hotspot during Fast Transfer, and to a remote processing server on your network if you set one up.
  PlaudLocalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlaudLocalTests
    dependencies:
      - target: PlaudLocal
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.metahertz.plaudlocal.tests
      GENERATE_INFOPLIST_FILE: true
schemes:
  PlaudLocal:
    build:
      targets:
        PlaudLocal: all
        PlaudLocalTests: [test]
    test:
      targets:
        - PlaudLocalTests
      gatherCoverageData: false
